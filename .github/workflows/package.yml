name: Package and release skill

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os; from pathlib import Path; expected = "v" + Path("VERSION").read_text(encoding="utf-8").strip(); actual = os.environ["RELEASE_TAG"]; assert actual == expected, f"Tag {actual} must match VERSION ({expected})"'
      - name: Test packaging
        run: python -m unittest discover -s tests -v
      - name: Build and verify ZIP
        run: python scripts/package.py
      - name: Upload downloadable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dnd-character-art-${{ github.sha }}
          path: |
            dist/dnd-character-art.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dnd-character-art-${{ github.sha }}
          path: dist
      - name: Verify downloaded checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft.txt 2>/dev/null; then
            if [ "$(cat release-draft.txt)" = "false" ]; then
              mkdir existing
              gh release download "$RELEASE_TAG" --pattern dnd-character-art.zip --pattern SHA256SUMS.txt --dir existing
              cmp dist/dnd-character-art.zip existing/dnd-character-art.zip
              cmp dist/SHA256SUMS.txt existing/SHA256SUMS.txt
              echo "Published release already contains the identical package."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Portable D&D character art skill with seven style references. Download dnd-character-art.zip and unpack it; usage instructions are included."
          fi
          gh release upload "$RELEASE_TAG" dist/dnd-character-art.zip dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
